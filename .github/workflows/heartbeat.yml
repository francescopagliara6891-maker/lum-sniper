name: Heartbeat (Controllo Vita)

on:
  schedule:
    # Alle 08:00 UTC di ogni Lunedì (che sono le 09:00 o 10:00 in Italia a seconda dell'ora legale)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permette di testarlo manualmente subito

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode="HTML" \
          -d text="❤️ <b>LUM SNIPER STATUS: ONLINE</b>%0A%0ACiao Francesco, inizio la settimana!%0AIl sistema di monitoraggio è attivo e scansiona ogni 30 minuti.%0A%0ABuono studio!"
